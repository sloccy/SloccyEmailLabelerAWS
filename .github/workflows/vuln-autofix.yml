name: Go vuln auto-fix

on:
  schedule:
    - cron: '0 6 * * 1'  # every Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  vuln-autofix:
    uses: sloccy/shared-ci/.github/workflows/vuln-autofix.yml@main
    # A PAT (not GITHUB_TOKEN) is required for the full hands-free chain: GITHUB_TOKEN
    # events can't trigger other workflows, so a bot-authored PR never runs CI, and a
    # bot-enabled auto-merge never triggers deploy.yml on the merge push. Falls back to
    # the old manual-intervention behavior if the secret is missing/expired.
    secrets:
      pr_token: ${{ secrets.WORKFLOW_TOKEN }}
