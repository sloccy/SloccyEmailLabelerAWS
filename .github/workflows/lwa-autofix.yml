name: Lambda Web Adapter auto-fix

# Counterpart to vuln-autofix.yml for the one dependency govulncheck/Dependabot can't see:
# the Lambda Web Adapter layer. Bumps only when upstream publishes an advisory the pinned
# release is still exposed to, and only to the lowest fixed release. See scripts/lwa-autofix.sh.
on:
  schedule:
    - cron: '30 6 * * *'  # daily, after vuln-autofix
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  lwa-autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check advisories and bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/lwa-autofix.sh

      - name: Open PR
        id: create-pr
        if: steps.bump.outputs.bumped != ''
        uses: peter-evans/create-pull-request@v8
        with:
          # PAT, not GITHUB_TOKEN: bot-token PRs never trigger CI, and bot-enabled
          # auto-merge never triggers deploy.yml on the merge push.
          token: ${{ secrets.WORKFLOW_TOKEN }}
          branch: chore/lwa-autofix
          commit-message: "chore: bump Lambda Web Adapter layer for upstream advisory"
          title: "chore: bump Lambda Web Adapter layer for upstream advisory"
          labels: security,dependencies
          body: |
            Automated bump: upstream published a security advisory for the pinned Lambda Web
            Adapter release.

            ${{ steps.bump.outputs.bumped }}

            Bumped to the lowest layer version carrying the fix, not latest.

      - name: Enable auto-merge
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          PR_NUM: ${{ steps.create-pr.outputs.pull-request-number }}
        run: gh pr merge --auto --squash "$PR_NUM"

      - name: Wait for PR checks
        # A failure in the PR's CI would otherwise leave a green run and a silently stuck
        # PR. Fail this run so GitHub emails the owner; the daily rerun repeats until fixed.
        if: steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          PR_NUM: ${{ steps.create-pr.outputs.pull-request-number }}
        run: |
          for _ in $(seq 1 30); do
            out=$(gh pr checks "$PR_NUM" 2>&1 || true)
            grep -q "no checks reported" <<<"$out" || break
            sleep 10
          done
          if ! timeout 40m gh pr checks "$PR_NUM" --watch --fail-fast --interval 30; then
            echo "::error::checks on PR #$PR_NUM failed or timed out — the bump is stuck and needs manual attention"
            exit 1
          fi

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}  # not the PAT: self-authored activity sends the owner no email
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --label lwa-autofix-failure --state open \
                       --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $RUN_URL" || true
          else
            gh issue create --title "lwa-autofix is failing" --label lwa-autofix-failure \
              --body "The Lambda Web Adapter advisory check or its bump PR is failing. Latest run: $RUN_URL" || true
          fi
