name: Deploy

on:
  push:
    branches: [main]
  # Manual escape hatch: a merge pushed by GITHUB_TOKEN (bot-enabled auto-merge) can't
  # trigger this workflow, so allow deploying main by hand from the Actions tab.
  workflow_dispatch:

# Required for GitHub OIDC -> AWS role assumption (no long-lived keys).
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ollamail
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true
      - run: go build ./...
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - uses: aws-actions/setup-sam@v3
        with:
          use-installer: true

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # Drops the artifacts the deploy just superseded. Runs only on success, so a
      # failed deploy leaves the previous set intact for CloudFormation to roll back to.
      - name: Prune superseded deploy artifacts
        run: ./scripts/prune-sam-bucket.sh
