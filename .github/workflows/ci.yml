name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      # static/vendor is gitignored and fetched at build time (the Makefile does this via
      # sam build on deploy). Without it the binary embeds an incomplete asset set, so do
      # it here too and test what actually ships.
      - name: Vendor front-end deps
        run: ./scripts/vendor.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        # v7 of the action supports golangci-lint v2 (our .golangci.yml is version "2").
        # Pin to a v2 build compiled with Go >= our go.mod toolchain.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
