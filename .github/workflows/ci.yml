name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      # static/vendor is gitignored and fetched at build time (the Makefile does this via
      # sam build on deploy). Without it the binary embeds an incomplete asset set, so do
      # it here too and test what actually ships.
      - name: Vendor front-end deps
        run: ./scripts/vendor.sh

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: golangci-lint
        # Deliberately unpinned. gosec and staticcheck ship new rules for vulnerability
        # classes that did not exist when any given release was cut, so tracking latest
        # is the point of running them — a pin quietly opts out of every check added
        # after it. The accepted cost is that an upstream release can turn this job red
        # without a code change; that is a real finding to triage, not a build break to
        # route around. Deploys are unaffected either way: deploy.yml runs its own test
        # job and never depends on this workflow.
        #
        # The action itself stays pinned (@v9): that is third-party executable code
        # running with repo credentials, where pinning is the security win, not the
        # security cost. The two go in opposite directions on purpose. @v9 is also what
        # supports golangci-lint v2, which .golangci.yml's `version: "2"` requires.
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
