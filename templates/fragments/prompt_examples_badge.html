<span class="badge border text-secondary" id="prompt-examples-badge-{{.ID}}">
  {{.Total}} example{{if ne .Total 1}}s{{end}}
  {{if gt .Total 0}}
  <button type="button" class="btn btn-link btn-sm p-0 ms-1 text-danger align-baseline" style="font-size:inherit;text-decoration:underline"
    hx-post="/fragments/prompts/{{.ID}}/clear-examples"
    hx-target="#prompt-examples-badge-{{.ID}}"
    hx-swap="outerHTML"
    hx-confirm="Clear all {{.Total}} stored examples for this rule? AI prompt improvement will start from scratch again. This can't be undone.">clear</button>
  {{end}}
</span>
