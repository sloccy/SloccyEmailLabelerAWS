<div class="stats mb-4">
  <div class="stat stat-accent-primary">
    <div class="stat-title">Accounts</div>
    <div class="stat-value text-primary font-monospace">{{.AccountCount}}</div>
    <div class="stat-desc">Connected</div>
  </div>
  <div class="stat stat-accent-success">
    <div class="stat-title">Active Prompts</div>
    <div class="stat-value text-success font-monospace">{{.ActivePrompts}}</div>
    <div class="stat-desc">Rules running</div>
  </div>
  <div class="stat stat-accent-neutral">
    <div class="stat-title">Scan Cadence</div>
    <div class="stat-value font-monospace">{{.ScanCadence}}</div>
    <div class="stat-desc">Automatic</div>
  </div>
</div>
<h6 class="section-title">Recent Activity</h6>
{{template "logs_list" .Logs}}
