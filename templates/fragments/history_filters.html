<!-- hx-target/hx-swap/hx-include are set once here and inherited by every control below
     (htmx walks up to the nearest ancestor that sets each attribute) — only hx-get and
     hx-trigger differ per control, so only those are repeated. -->
<div hx-target="#hist-body" hx-swap="innerHTML" hx-include="#hist-filter-form">
  <div class="mb-0">
    <label class="form-label">Account</label>
    <select name="account_id" class="form-select form-select-sm"
      hx-get="/fragments/history"
      hx-trigger="change">
      <option value="">All accounts</option>
      {{range .Accounts}}
      <option value="{{.ID}}">{{.Email}}</option>
      {{end}}
    </select>
  </div>
  <div class="mb-0">
    <label class="form-label">Rule</label>
    <select name="prompt_id" class="form-select form-select-sm"
      hx-get="/fragments/history"
      hx-trigger="change">
      <option value="">All rules</option>
      <option value="none">Uncategorized</option>
      {{range .Prompts}}
      <option value="{{.ID}}">{{.Name}}</option>
      {{end}}
    </select>
  </div>
  <div class="mb-0">
    <label class="form-label">Subject</label>
    <input type="text" class="form-control form-control-sm" name="subject" placeholder="Search subject…"
      hx-get="/fragments/history"
      hx-trigger="input delay:350ms">
  </div>
  <div class="mb-0">
    <label class="form-label">Sender</label>
    <input type="text" class="form-control form-control-sm" name="sender" placeholder="Search sender…"
      hx-get="/fragments/history"
      hx-trigger="input delay:350ms">
  </div>
</div>
