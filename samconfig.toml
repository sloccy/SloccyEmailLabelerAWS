# SAM deploy configuration. Read by `sam deploy` locally and in CI (deploy.yml).
# Contains no secrets — only the stack name, region, capabilities, and the ARN of the
# SSM parameter that holds the Google OAuth credentials.
version = 0.1

[default.deploy.parameters]
stack_name = "ollamail"
region = "us-east-1"
resolve_s3 = true
resolve_image_repos = true
capabilities = "CAPABILITY_IAM"
confirm_changeset = false
fail_on_empty_changeset = false
parameter_overrides = [
    "CredentialsSsmArn=arn:aws:ssm:us-east-1:508768431323:parameter/ollamail/credentials",
    # Gmail push. Audience is an arbitrary constant we also set on the Pub/Sub
    # subscription (--push-auth-token-audience); it need not be the Function URL.
    "PubSubTopic=projects/gmail-auto-labeler-487804/topics/gmail-push",
    "PushOidcAudience=ollamail-gmail-push",
    "PushOidcServiceAccount=gmail-push-invoker@gmail-auto-labeler-487804.iam.gserviceaccount.com",
    # Cloudflare Access in front of the Web UI (CloudFront + OAC fronting the AWS_IAM
    # Function URL). See README for the Cloudflare-side CNAME + Access app setup.
    "CfAccessTeamDomain=https://sloccy.cloudflareaccess.com",
    "CfAccessAud=786e8401f074568d37458301bac91efce8d0e66611d202eb89be2f39fb4a4420",
]
