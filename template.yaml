AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: SloccyEmailLabelerAWS — Gmail labeler on Lambda + DynamoDB + Bedrock Nova Micro

Parameters:
  BedrockModel:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  GmailLookbackHours:
    Type: Number
    Default: 24
  GmailMaxResults:
    Type: Number
    Default: 50
  EmailBodyTruncation:
    Type: Number
    Default: 3000
  LogRetentionDays:
    Type: Number
    Default: 30
  HistoryMaxLimit:
    Type: Number
    Default: 500
  # ARN of the SSM SecureString parameter holding the Google OAuth credentials JSON.
  # Create with: aws ssm put-parameter --name /ollamail/credentials --type SecureString --value "$(cat credentials.json)"
  CredentialsSsmArn:
    Type: String
    Description: ARN of the SSM parameter /ollamail/credentials

Globals:
  Function:
    # PackageType: Image functions must not set Runtime/Handler.
    # x86_64 matches the amd64 GitHub Actions runner that builds the image (native, no QEMU).
    Architectures: [x86_64]
    Environment:
      Variables:
        DDB_TABLE: !Ref OlamailTable
        BEDROCK_MODEL: !Ref BedrockModel
        GMAIL_LOOKBACK_HOURS: !Ref GmailLookbackHours
        GMAIL_MAX_RESULTS: !Ref GmailMaxResults
        EMAIL_BODY_TRUNCATION: !Ref EmailBodyTruncation
        LOG_RETENTION_DAYS: !Ref LogRetentionDays
        HISTORY_MAX_LIMIT: !Ref HistoryMaxLimit
        # Name of the SSM SecureString the app reads at runtime for Google OAuth creds.
        CREDENTIALS_SSM_PARAM: /ollamail/credentials

Resources:

  # ----------------------------------------------------------------
  # DynamoDB table (single-table design, on-demand, TTL enabled)
  # ----------------------------------------------------------------
  OlamailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: ollamail
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ----------------------------------------------------------------
  # Shared IAM role for both functions
  # ----------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OlamailPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt OlamailTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Ref CredentialsSsmArn

  # ----------------------------------------------------------------
  # Web function — serves the management UI via Function URL
  # ----------------------------------------------------------------
  WebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 30
      FunctionUrlConfig:
        AuthType: AWS_IAM   # change to NONE to allow public access (add your own auth)
        InvokeMode: BUFFERED
      Environment:
        Variables:
          MODE: web
          AWS_LAMBDA_EXEC_WRAPPER: /opt/extensions/lambda-adapter
          PORT: "8080"

  # ----------------------------------------------------------------
  # Scan function — invoked by EventBridge on a schedule
  # ----------------------------------------------------------------
  ScanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 120
      # NOTE: ReservedConcurrentExecutions omitted — this account's Lambda concurrency
      # quota is too low to reserve (would drop unreserved below the required minimum of 10).
      # Overlap is safe: scans dedupe processed emails in DynamoDB. Re-add `ReservedConcurrentExecutions: 1`
      # after requesting a concurrency-limit increase via Service Quotas.
      Environment:
        Variables:
          MODE: scan
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            State: ENABLED

Outputs:
  WebFunctionUrl:
    Description: Management UI URL (requires AWS IAM auth by default)
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  DynamoDBTableName:
    Value: !Ref OlamailTable
