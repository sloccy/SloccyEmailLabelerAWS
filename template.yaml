AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: SloccyEmailLabelerAWS — Gmail labeler on Lambda + DynamoDB + Bedrock Nova Micro

Parameters:
  BedrockModel:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  GmailLookbackHours:
    Type: Number
    Default: 24
  GmailMaxResults:
    Type: Number
    Default: 50
  EmailBodyTruncation:
    Type: Number
    Default: 3000
  LogRetentionDays:
    Type: Number
    Default: 30
  HistoryMaxLimit:
    Type: Number
    Default: 500
  # ARN of the SSM SecureString parameter holding the Google OAuth credentials JSON.
  # Create with: aws ssm put-parameter --name /ollamail/credentials --type SecureString --value "$(cat credentials.json)"
  CredentialsSsmArn:
    Type: String
    Description: ARN of the SSM parameter /ollamail/credentials
  # Gmail push (users.watch → Pub/Sub → PushFunction). Leave PubSubTopic empty to
  # keep polling-only behaviour; set all three to enable real-time push.
  PubSubTopic:
    Type: String
    Default: ""
    Description: Cloud Pub/Sub topic for Gmail push, e.g. projects/<proj>/topics/gmail-push
  PushOidcAudience:
    Type: String
    Default: ""
    Description: Expected OIDC audience on the Pub/Sub push token (e.g. the PushFunction URL)
  PushOidcServiceAccount:
    Type: String
    Default: ""
    Description: Service-account email configured on the Pub/Sub push subscription
  BudgetAlertEmail:
    Type: String
    Default: slocum.brendan@gmail.com
    Description: Email for the monthly billing-budget alerts
  # Cloudflare Access (Zero Trust) in front of the Web UI. When CfAccessAud is set, a
  # CloudFront distribution (OAC-signed to the still-AWS_IAM Function URL) is created and
  # the app enforces the Cf-Access-Jwt-Assertion header. Leave both empty to keep the Web
  # UI private (AWS_IAM only, browsed via the local SigV4 proxy).
  CfAccessTeamDomain:
    Type: String
    Default: ""
    Description: e.g. https://yourteam.cloudflareaccess.com
  CfAccessAud:
    Type: String
    Default: ""
    Description: Cloudflare Access application Audience (AUD) tag

Conditions:
  CfAccessEnabled: !Not [!Equals [!Ref CfAccessAud, ""]]

Globals:
  Function:
    # PackageType: Image functions must not set Runtime/Handler.
    # x86_64 matches the amd64 GitHub Actions runner that builds the image (native, no QEMU).
    Architectures: [x86_64]
    Environment:
      Variables:
        DDB_TABLE: !Ref OlamailTable
        BEDROCK_MODEL: !Ref BedrockModel
        GMAIL_LOOKBACK_HOURS: !Ref GmailLookbackHours
        GMAIL_MAX_RESULTS: !Ref GmailMaxResults
        EMAIL_BODY_TRUNCATION: !Ref EmailBodyTruncation
        LOG_RETENTION_DAYS: !Ref LogRetentionDays
        HISTORY_MAX_LIMIT: !Ref HistoryMaxLimit
        # Name of the SSM SecureString the app reads at runtime for Google OAuth creds.
        CREDENTIALS_SSM_PARAM: /ollamail/credentials
        # Gmail push wiring (empty = disabled). Web/scan use the topic to register/renew
        # watch(); push uses the audience + SA email to authenticate incoming notifications.
        PUBSUB_TOPIC: !Ref PubSubTopic
        PUSH_OIDC_AUDIENCE: !Ref PushOidcAudience
        PUSH_OIDC_SA_EMAIL: !Ref PushOidcServiceAccount

Resources:

  # ----------------------------------------------------------------
  # DynamoDB table (single-table design, on-demand, TTL enabled)
  # ----------------------------------------------------------------
  OlamailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: ollamail
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ----------------------------------------------------------------
  # Shared IAM role for both functions
  # ----------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OllamailPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt OlamailTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Cross-region inference profile (us.*) fans the real InvokeModel
                  # out to sibling US regions. Grant foundation-model in ANY US
                  # region (us-*) — covers current + future US regions, stays
                  # in-country, and excludes non-US regions.
                  - arn:aws:bedrock:us-*::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
                # Belt-and-suspenders: deny any InvokeModel targeting a non-US region,
                # regardless of which model/profile ARN is selected.
                Condition:
                  StringLike:
                    aws:RequestedRegion: us-*
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Ref CredentialsSsmArn
              # Web UI rewrites the scan schedule when the user changes the interval.
              - Effect: Allow
                Action:
                  - scheduler:GetSchedule
                  - scheduler:UpdateSchedule
                Resource: !Sub arn:aws:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/default/ollamail-scan
              # UpdateSchedule re-supplies the target RoleArn, which requires PassRole.
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource: !GetAtt SchedulerInvokeRole.Arn

  # ----------------------------------------------------------------
  # Web function — serves the management UI via Function URL
  # ----------------------------------------------------------------
  WebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 30
      FunctionUrlConfig:
        # Locked to AWS_IAM: only requests signed with your AWS credentials can reach it.
        # Browse it locally with a SigV4 signing proxy (see README). Nothing is public.
        AuthType: AWS_IAM
        InvokeMode: BUFFERED
      Environment:
        Variables:
          MODE: web
          AWS_LAMBDA_EXEC_WRAPPER: /opt/extensions/lambda-adapter
          # App listens on AWS_LWA_PORT; the adapter forwards Function URL requests here.
          AWS_LWA_PORT: "8080"
          # Scan-schedule rewriting: name to update + ARNs re-supplied on every UpdateSchedule.
          SCAN_SCHEDULE_NAME: ollamail-scan
          SCAN_FUNCTION_ARN: !GetAtt ScanFunction.Arn
          SCHEDULER_ROLE_ARN: !GetAtt SchedulerInvokeRole.Arn
          CF_ACCESS_TEAM_DOMAIN: !Ref CfAccessTeamDomain
          CF_ACCESS_AUD: !Ref CfAccessAud

  # ----------------------------------------------------------------
  # CloudFront in front of the IAM Function URL (created only when Cloudflare Access is
  # configured). Origin Access Control SigV4-signs each request to the Function URL, which
  # is why the URL can stay AWS_IAM (public Function URLs need not be enabled on the
  # account). Point your Cloudflare proxied CNAME at this distribution's domain; Cloudflare
  # Access does Google SSO and injects the Cf-Access-Jwt-Assertion header, which the app
  # verifies (see cfaccess.go) so hitting the raw CloudFront/Function URL directly 403s.
  # ----------------------------------------------------------------
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CfAccessEnabled
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CfAccessEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: OllaMail Web UI (OAC-signed to IAM Function URL; app enforces Cloudflare Access JWT)
        PriceClass: PriceClass_100
        Origins:
          - Id: WebFunctionUrlOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt WebFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt WebOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: WebFunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          # CachingDisabled + AllViewerExceptHostHeader (managed policies): don't cache
          # dynamic content, forward all viewer headers (incl. Cf-Access-Jwt-Assertion)
          # except Host (Host must stay the origin's for OAC signing).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  WebFunctionCloudFrontPermission:
    Type: AWS::Lambda::Permission
    Condition: CfAccessEnabled
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution.Id}"
      FunctionUrlAuthType: AWS_IAM

  # ----------------------------------------------------------------
  # Scan function — invoked by EventBridge on a schedule
  # ----------------------------------------------------------------
  ScanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      # Fixed name so SchedulerInvokeRole can grant invoke via a constructed ARN instead of
      # !GetAtt — that breaks the LambdaRole→SchedulerInvokeRole→ScanFunction→LambdaRole cycle.
      FunctionName: ollamail-scan-fn
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 120
      # NOTE: ReservedConcurrentExecutions omitted — this account's Lambda concurrency
      # quota is too low to reserve (would drop unreserved below the required minimum of 10).
      # Overlap is safe: scans dedupe processed emails in DynamoDB. Re-add `ReservedConcurrentExecutions: 1`
      # after requesting a concurrency-limit increase via Service Quotas.
      Environment:
        Variables:
          MODE: scan

  # ----------------------------------------------------------------
  # Push function — public Function URL that receives Gmail Pub/Sub push
  # notifications. AuthType NONE because Pub/Sub can't sign SigV4; the app
  # instead validates the Google-signed OIDC token on every request.
  # ----------------------------------------------------------------
  PushFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 120
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Environment:
        Variables:
          MODE: push
          AWS_LAMBDA_EXEC_WRAPPER: /opt/extensions/lambda-adapter
          AWS_LWA_PORT: "8080"

  # ----------------------------------------------------------------
  # EventBridge Scheduler schedule that triggers the scan.
  # Defined explicitly (not via the function's Events property) so it has a stable name the
  # Web UI can rewrite at runtime via scheduler:UpdateSchedule. Real-time labeling is handled
  # by Gmail push; this scheduled pass is a daily safety net (catch-up scan + watch() renewal).
  # The Web app re-applies the user's stored interval on startup after each deploy.
  # ----------------------------------------------------------------
  ScanSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ollamail-scan
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: rate(1 day)
      State: ENABLED
      Target:
        Arn: !GetAtt ScanFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn

  # Role EventBridge Scheduler assumes to invoke the ScanFunction.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeScanFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ollamail-scan-fn

  # ----------------------------------------------------------------
  # $5/month hard cap. AWS Budgets only alerts by default, so a Budgets Action
  # attaches an explicit Bedrock-deny policy to the Lambda role at $5 actual spend,
  # halting all LLM (the app's only real cost) until the next month or a manual
  # detach. DynamoDB/Lambda spend at this scale is negligible. Cost data can lag a
  # few hours, so the cap is "within a few hours of $5," not instantaneous.
  # ----------------------------------------------------------------
  BedrockDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Deny-all Bedrock invocation; parked until the budget action attaches it.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"

  BudgetActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttachBedrockDeny
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:ListAttachedRolePolicies
                Resource: !GetAtt LambdaRole.Arn

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: ollamail-monthly-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  # At $5 actual spend, attach the Bedrock-deny policy to the Lambda role automatically.
  StopBedrockAtCap:
    Type: AWS::Budgets::BudgetsAction
    DependsOn: MonthlyBudget
    Properties:
      BudgetName: ollamail-monthly-5usd
      NotificationType: ACTUAL
      ActionType: APPLY_IAM_POLICY
      ApprovalModel: AUTOMATIC
      ActionThreshold:
        Type: ABSOLUTE_VALUE
        Value: 5
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref BedrockDenyPolicy
          Roles:
            - !Ref LambdaRole
      ExecutionRoleArn: !GetAtt BudgetActionRole.Arn
      Subscribers:
        - Type: EMAIL
          Address: !Ref BudgetAlertEmail

Outputs:
  WebFunctionUrl:
    Description: Raw Web UI Function URL (AWS_IAM — browse via a local SigV4 proxy, or via CloudFront/Cloudflare below)
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  WebDistributionDomain:
    Condition: CfAccessEnabled
    Description: Point your Cloudflare proxied CNAME (mailclass) at this CloudFront domain
    Value: !GetAtt WebDistribution.DomainName
  PushFunctionUrl:
    Description: Public push webhook URL — set as the Pub/Sub push endpoint + OIDC audience
    Value: !GetAtt PushFunctionUrl.FunctionUrl
  DynamoDBTableName:
    Value: !Ref OlamailTable
