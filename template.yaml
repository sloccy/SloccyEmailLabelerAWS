AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: SloccyEmailLabelerAWS — Gmail labeler on Lambda + DynamoDB + Bedrock Nova Micro

Parameters:
  BedrockModel:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  GmailLookbackHours:
    Type: Number
    Default: 24
  GmailMaxResults:
    Type: Number
    Default: 50
  EmailBodyTruncation:
    Type: Number
    Default: 3000
  LogRetentionDays:
    Type: Number
    Default: 30
  HistoryMaxLimit:
    Type: Number
    Default: 500
  # ARN of the SSM SecureString parameter holding the Google OAuth credentials JSON.
  # Create with: aws ssm put-parameter --name /ollamail/credentials --type SecureString --value "$(cat credentials.json)"
  CredentialsSsmArn:
    Type: String
    Description: ARN of the SSM parameter /ollamail/credentials
  # Cloudflare Access (Zero Trust) protection for the Web UI. When CfAccessAud is set,
  # the Function URL becomes public (AuthType NONE) and the app enforces the Access JWT.
  # Leave both empty to keep the Function URL locked to AWS_IAM.
  CfAccessTeamDomain:
    Type: String
    Default: ""
    Description: e.g. https://yourteam.cloudflareaccess.com
  CfAccessAud:
    Type: String
    Default: ""
    Description: Cloudflare Access application Audience (AUD) tag

Globals:
  Function:
    # PackageType: Image functions must not set Runtime/Handler.
    # x86_64 matches the amd64 GitHub Actions runner that builds the image (native, no QEMU).
    Architectures: [x86_64]
    Environment:
      Variables:
        DDB_TABLE: !Ref OlamailTable
        BEDROCK_MODEL: !Ref BedrockModel
        GMAIL_LOOKBACK_HOURS: !Ref GmailLookbackHours
        GMAIL_MAX_RESULTS: !Ref GmailMaxResults
        EMAIL_BODY_TRUNCATION: !Ref EmailBodyTruncation
        LOG_RETENTION_DAYS: !Ref LogRetentionDays
        HISTORY_MAX_LIMIT: !Ref HistoryMaxLimit
        # Name of the SSM SecureString the app reads at runtime for Google OAuth creds.
        CREDENTIALS_SSM_PARAM: /ollamail/credentials

Conditions:
  # When an Access AUD is supplied, expose the Web UI Function URL publicly so
  # Cloudflare Access can sit in front; the app then enforces the Access JWT.
  CfAccessEnabled: !Not [!Equals [!Ref CfAccessAud, ""]]

Resources:

  # ----------------------------------------------------------------
  # DynamoDB table (single-table design, on-demand, TTL enabled)
  # ----------------------------------------------------------------
  OlamailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      TableName: ollamail
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ----------------------------------------------------------------
  # Shared IAM role for both functions
  # ----------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OlamailPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt OlamailTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:${AWS::Region}::foundation-model/*
                  - !Sub arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Ref CredentialsSsmArn

  # ----------------------------------------------------------------
  # Web function — serves the management UI via Function URL
  # ----------------------------------------------------------------
  WebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 30
      FunctionUrlConfig:
        # Always AWS_IAM. This account blocks public (NONE) Function URLs, so when Cloudflare
        # Access is configured we front the URL with CloudFront + Origin Access Control, which
        # SigV4-signs requests to this IAM URL. The app still enforces the Cloudflare Access JWT.
        AuthType: AWS_IAM
        InvokeMode: BUFFERED
      Environment:
        Variables:
          MODE: web
          AWS_LAMBDA_EXEC_WRAPPER: /opt/extensions/lambda-adapter
          # App listens on AWS_LWA_PORT; the adapter forwards Function URL requests here.
          AWS_LWA_PORT: "8080"
          CF_ACCESS_TEAM_DOMAIN: !Ref CfAccessTeamDomain
          CF_ACCESS_AUD: !Ref CfAccessAud

  # ----------------------------------------------------------------
  # CloudFront in front of the IAM Function URL (created only when Cloudflare Access is
  # configured). Origin Access Control SigV4-signs each request to the Function URL, which
  # is why the URL can stay AWS_IAM (public URLs are blocked on this account). Point your
  # Cloudflare proxied CNAME at this distribution's domain; Cloudflare Access does Google
  # SSO and injects the Cf-Access-Jwt-Assertion header, which the app verifies.
  # ----------------------------------------------------------------
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: CfAccessEnabled
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web-oac"
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CfAccessEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: OllaMail Web UI (OAC-signed to IAM Function URL; app enforces Cloudflare Access JWT)
        PriceClass: PriceClass_100
        Origins:
          - Id: WebFunctionUrlOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt WebFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt WebOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: WebFunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          # CachingDisabled + AllViewerExceptHostHeader (managed policies): don't cache
          # dynamic content, forward all viewer headers (incl. Cf-Access-Jwt-Assertion)
          # except Host (Host must stay the origin's for OAC signing).
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  WebFunctionCloudFrontPermission:
    Type: AWS::Lambda::Permission
    Condition: CfAccessEnabled
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution.Id}"
      FunctionUrlAuthType: AWS_IAM

  # ----------------------------------------------------------------
  # Scan function — invoked by EventBridge on a schedule
  # ----------------------------------------------------------------
  ScanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 256
      Timeout: 120
      # NOTE: ReservedConcurrentExecutions omitted — this account's Lambda concurrency
      # quota is too low to reserve (would drop unreserved below the required minimum of 10).
      # Overlap is safe: scans dedupe processed emails in DynamoDB. Re-add `ReservedConcurrentExecutions: 1`
      # after requesting a concurrency-limit increase via Service Quotas.
      Environment:
        Variables:
          MODE: scan
      Events:
        Schedule:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: rate(1 minute)
            State: ENABLED

Outputs:
  WebFunctionUrl:
    Description: Raw Function URL (AWS_IAM — not browsable directly)
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  WebDistributionDomain:
    Condition: CfAccessEnabled
    Description: Point your Cloudflare proxied CNAME (mailclass) at this CloudFront domain
    Value: !GetAtt WebDistribution.DomainName
  DynamoDBTableName:
    Value: !Ref OlamailTable
