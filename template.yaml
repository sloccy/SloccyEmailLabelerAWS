AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31

Description: SloccyEmailLabelerAWS — Gmail labeler on Lambda + DynamoDB + Amazon Bedrock

Parameters:
  # Fallback model id used only until a classify_model setting is configured (see
  # llm.DefaultModel) — the model actually used for classification is whatever's set
  # in the app's Settings UI.
  BedrockModel:
    Type: String
    Default: us.amazon.nova-micro-v1:0
  GmailLookbackHours:
    Type: Number
    Default: 24
  GmailMaxResults:
    Type: Number
    Default: 50
  EmailBodyTruncation:
    Type: Number
    Default: 3000
  LogRetentionDays:
    Type: Number
    Default: 30
  HistoryMaxLimit:
    Type: Number
    Default: 500
  # ARN of the SSM SecureString parameter holding the Google OAuth credentials JSON.
  # Create with: aws ssm put-parameter --name /ollamail/credentials --type SecureString --value "$(cat credentials.json)"
  CredentialsSsmArn:
    Type: String
    Description: ARN of the SSM parameter /ollamail/credentials
  # Gmail push (users.watch → Pub/Sub → PushFunction). Leave PubSubTopic empty to
  # keep polling-only behaviour; set all three to enable real-time push.
  PubSubTopic:
    Type: String
    Default: ""
    Description: Cloud Pub/Sub topic for Gmail push, e.g. projects/<proj>/topics/gmail-push
  PushOidcAudience:
    Type: String
    Default: ""
    Description: Expected OIDC audience on the Pub/Sub push token (e.g. the PushFunction URL)
  PushOidcServiceAccount:
    Type: String
    Default: ""
    Description: Service-account email configured on the Pub/Sub push subscription
  BudgetAlertEmail:
    Type: String
    Default: slocum.brendan@gmail.com
    Description: Email for the monthly billing-budget alerts
  # AWS Budgets is account-global, not region-scoped — a budget with this stack's
  # BudgetName can only exist once per account. Set to "false" when standing up a
  # second same-account stack in another region alongside an existing one (e.g. a
  # region migration), then back to "true" (the default) once the old stack/budget
  # is torn down.
  CreateBudget:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
  # Cloudflare Access (Zero Trust) in front of the Web UI. When CfAccessAud is set, a
  # CloudFront distribution (OAC-signed to the still-AWS_IAM Function URL) is created and
  # the app enforces the Cf-Access-Jwt-Assertion header. Leave both empty to keep the Web
  # UI private (AWS_IAM only, browsed via the local SigV4 proxy).
  CfAccessTeamDomain:
    Type: String
    Default: ""
    Description: e.g. https://yourteam.cloudflareaccess.com
  CfAccessAud:
    Type: String
    Default: ""
    Description: Cloudflare Access application Audience (AUD) tag
  # Lambda Web Adapter layer (arm64) — lets the custom-runtime binary serve plain HTTP.
  # Referenced by both WebFunction and PushFunction via !Sub (below) so the region stays
  # dynamic (${AWS::Region}); only the version number is duplicated, and only here.
  LambdaWebAdapterLayerVersion:
    Type: Number
    Default: 28

Conditions:
  CfAccessEnabled: !Not [!Equals [!Ref CfAccessAud, ""]]
  ShouldCreateBudget: !Equals [!Ref CreateBudget, "true"]

Globals:
  Function:
    # Zip (provided.al2023) packaging — no container image, no ECR. Each function's
    # Metadata.BuildMethod: makefile builds the same Go binary to bootstrap; MODE
    # env var selects behavior at runtime. arm64 (Graviton2): ~20% cheaper per
    # GB-second than x86_64 and often faster; the app is pure Go (CGO_ENABLED=0,
    # no cgo/arch-specific deps) so cross-compiling GOARCH=arm64 from the amd64
    # GitHub Actions runner needs no emulation/QEMU — just a different GOARCH.
    Architectures: [arm64]
    Environment:
      Variables:
        DDB_TABLE: !Ref OlamailTable
        BEDROCK_MODEL: !Ref BedrockModel
        GMAIL_LOOKBACK_HOURS: !Ref GmailLookbackHours
        GMAIL_MAX_RESULTS: !Ref GmailMaxResults
        EMAIL_BODY_TRUNCATION: !Ref EmailBodyTruncation
        LOG_RETENTION_DAYS: !Ref LogRetentionDays
        HISTORY_MAX_LIMIT: !Ref HistoryMaxLimit
        # Name of the SSM SecureString the app reads at runtime for Google OAuth creds.
        CREDENTIALS_SSM_PARAM: /ollamail/credentials
        # Gmail push wiring (empty = disabled). Web/scan use the topic to register/renew
        # watch(); push uses the audience + SA email to authenticate incoming notifications.
        PUBSUB_TOPIC: !Ref PubSubTopic
        PUSH_OIDC_AUDIENCE: !Ref PushOidcAudience
        PUSH_OIDC_SA_EMAIL: !Ref PushOidcServiceAccount

Resources:

  # ----------------------------------------------------------------
  # DynamoDB table (single-table design, provisioned 2/2, TTL enabled)
  # On-demand billing is excluded from DynamoDB's perpetual free tier (25 RCU + 25 WCU
  # + 25 GB, account-wide). Provisioned at 2/2 stays free while leaving ~23/23 of that
  # allowance for other projects. Classification concurrency (CLASSIFY_CONCURRENCY) is
  # decoupled from DB writes — a single serial writer per invocation (see
  # processor.processMessageIDs) keeps writes to one in flight at a time within a run,
  # and the LLM-debug write only fires under DEBUG_LOGGING. 2 (not 1) leaves a little
  # room for WebFunction/ScanFunction/PushFunction being separate Lambdas — or PushFunction
  # getting more than one concurrent invocation — each running its own writer. Bursts
  # above that may briefly throttle; the SDK retries and the scan dedupes + resumes next
  # run, so nothing is lost — see processor/processor.go's writeJob/applyWriteJob for the
  # write-serialization design.
  # ----------------------------------------------------------------
  OlamailTable:
    Type: AWS::DynamoDB::Table
    Properties:
      # Blocks DeleteTable (console, CLI, or a bad stack operation) until this flag is
      # flipped off. Free. Item-level restore is handled by config export/import (see
      # README) rather than PITR, which would bill per GB-month.
      DeletionProtectionEnabled: true
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 2
        WriteCapacityUnits: 2
      TableName: ollamail
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ----------------------------------------------------------------
  # Shared IAM role for both functions
  # ----------------------------------------------------------------
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: OllamailPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt OlamailTable.Arn
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Any region — geography is enforced solely by the app's model-selection
                  # logic (ModelOption.ProfileRegion / Flex in llm/bedrock.go, rendered in
                  # settings_form.html and server.go's classifyModelAllowed), not IAM.
                  - arn:aws:bedrock:*::foundation-model/*
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/*
              - Effect: Allow
                Action:
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"
              # AWS Price List API: drives dynamic model pricing and flex-tier eligibility
              # in the classification-model dropdown (see llm/pricing.go). Read-only,
              # account-agnostic catalog data — no narrower resource scope exists.
              - Effect: Allow
                Action:
                  - pricing:GetProducts
                Resource: "*"
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Ref CredentialsSsmArn
              # Per-account Gmail OAuth tokens live as SecureStrings under
              # /ollamail/accounts/<id>/token (see db/store.go tokenParamName) — kept out
              # of the DynamoDB table so table read access alone can't exfiltrate them.
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:PutParameter
                  - ssm:DeleteParameter
                Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ollamail/accounts/*

  # ----------------------------------------------------------------
  # Web function — serves the management UI via Function URL
  # ----------------------------------------------------------------
  WebFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Runtime: provided.al2023
      Handler: bootstrap
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 128
      Timeout: 30
      # Lambda Web Adapter layer: lets the custom-runtime binary serve plain HTTP,
      # forwarded from the Function URL. AWS_LAMBDA_EXEC_WRAPPER below points at
      # this layer's /opt/bootstrap wrapper script.
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:${LambdaWebAdapterLayerVersion}
      # Log to the retention-bounded custom group (see WebFunctionLogGroup) instead of
      # the implicit never-expiring /aws/lambda/* default.
      LoggingConfig:
        LogGroup: !Ref WebFunctionLogGroup
      FunctionUrlConfig:
        # AWS_IAM when Cloudflare Access is off (CfAccessAud unset): only requests
        # signed with your AWS credentials can reach it — browse locally with the
        # SigV4 signing proxy (see README), nothing is public.
        #
        # NONE when Cloudflare Access is on: CloudFront's OAC signer omits the
        # request body from its SigV4 signature, so an AWS_IAM Function URL rejects
        # every POST/PUT/PATCH (anything with a body) with InvalidSignatureException
        # even though GETs succeed. The app's Cloudflare Access JWT check
        # (cfaccess.go, wired in main.go) is the security gate in this mode instead.
        AuthType: !If [CfAccessEnabled, NONE, AWS_IAM]
        InvokeMode: BUFFERED
      Environment:
        Variables:
          MODE: web
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          # App listens on AWS_LWA_PORT; the adapter forwards Function URL requests here.
          AWS_LWA_PORT: "8080"
          CF_ACCESS_TEAM_DOMAIN: !Ref CfAccessTeamDomain
          CF_ACCESS_AUD: !Ref CfAccessAud
          # Mirrors the AuthType !If above so the app can fail closed: when the URL is
          # public (cfaccess) but the CF vars are missing, runWeb refuses to start.
          AUTH_MODE: !If [CfAccessEnabled, cfaccess, iam]

  # SAM auto-generates these two public-invoke permissions only when
  # FunctionUrlConfig.AuthType is the literal string "NONE". WebFunction's AuthType
  # is an !If intrinsic, which the SAM transform can't statically evaluate as NONE,
  # so it skips both and the AuthType:NONE URL 403s (AccessDeniedException) for
  # everyone — including CloudFront. Add them explicitly (matching what SAM emits
  # for PushFunction's literal AuthType: NONE), gated on the same condition as the
  # NONE branch above.
  WebFunctionUrlPublicPermission:
    Type: AWS::Lambda::Permission
    Condition: CfAccessEnabled
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  WebFunctionURLInvokeAllowPublicAccess:
    Type: AWS::Lambda::Permission
    Condition: CfAccessEnabled
    Properties:
      FunctionName: !Ref WebFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ----------------------------------------------------------------
  # CloudFront in front of the public (AuthType NONE) Function URL, created only when
  # Cloudflare Access is configured. No Origin Access Control: OAC's SigV4 signer omits
  # the request body, which breaks every POST/PUT/PATCH against an IAM Function URL (see
  # the AuthType comment on WebFunction above) — so the origin is public instead, and the
  # security gate is entirely the app-layer Cloudflare Access JWT check (cfaccess.go).
  # Point your Cloudflare proxied CNAME at this distribution's domain; Cloudflare Access
  # does Google SSO and injects the Cf-Access-Jwt-Assertion header, which the app verifies
  # so hitting the raw CloudFront/Function URL directly still 403s.
  #
  # WHY THIS RESOURCE IS REQUIRED — DO NOT REMOVE TO "SAVE A SERVICE":
  # A Lambda Function URL only presents a TLS cert for its own *.lambda-url.*.on.aws
  # domain and routes by Host header. Pointing a Cloudflare proxied CNAME straight at
  # the Function URL sends SNI+Host = the custom domain (mailclass.sloccy.com), which
  # mismatches the origin's cert and fails the TLS handshake (Cloudflare error 525/526).
  # Overriding SNI to the .on.aws name is a Cloudflare Enterprise-only Origin Rules
  # feature, not available on this account's plan. So a non-Enterprise Cloudflare setup
  # needs an AWS-side custom-domain front between Cloudflare and the Function URL.
  # CloudFront (with the ACM cert below) is that front: it presents the ACM cert to
  # Cloudflare and rewrites Host back to the origin's domain via the
  # AllViewerExceptHostHeader origin-request policy (while still forwarding
  # Cf-Access-Jwt-Assertion). API Gateway custom domains are the only other AWS-native
  # alternative, and would add a service rather than remove one.
  # ----------------------------------------------------------------
  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: CfAccessEnabled
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: OllaMail Web UI (public Function URL; app enforces Cloudflare Access JWT)
        PriceClass: PriceClass_100
        Aliases:
          - mailclass.sloccy.com
        ViewerCertificate:
          AcmCertificateArn: arn:aws:acm:us-east-1:508768431323:certificate/9fd06b13-fdd3-4682-b832-46ed432d7529
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: WebFunctionUrlOrigin
            DomainName: !Select [2, !Split ["/", !GetAtt WebFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
        DefaultCacheBehavior:
          TargetOriginId: WebFunctionUrlOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          # CachingDisabled + AllViewerExceptHostHeader (managed policies): don't cache
          # dynamic content, forward all viewer headers (incl. Cf-Access-Jwt-Assertion)
          # except Host.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

  # ----------------------------------------------------------------
  # Scan function — invoked by EventBridge on a schedule
  # ----------------------------------------------------------------
  ScanFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Runtime: provided.al2023
      Handler: bootstrap
      # Fixed name so SchedulerInvokeRole can grant invoke via a constructed ARN instead of
      # !GetAtt — that breaks the LambdaRole→SchedulerInvokeRole→ScanFunction→LambdaRole cycle.
      # Renamed from ollamail-scan-fn (-arm suffix) during the image→zip/arm64 migration:
      # PackageType and Architectures are both immutable, so the update replaces this
      # resource, and CloudFormation refuses in-place replacement of a custom-named
      # resource unless the name itself changes too.
      FunctionName: ollamail-scan-fn-arm
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 128
      # 900s = Lambda's hard max. Flex-tier Bedrock requests are lower-priority and can queue
      # for minutes, so the old 120s cap killed runs mid-classification; this gives a full
      # backlog room to drain. Any overflow past 15 min is safe — a message claimed but not
      # confirmed by this run keeps its lease until it expires (see db.ClaimMessages), then
      # the next 2 AM run (or an overlapping push) picks it back up.
      Timeout: 900
      # NOTE: ReservedConcurrentExecutions omitted — this account's Lambda concurrency
      # quota is too low to reserve (would drop unreserved below the required minimum of 10).
      # Overlap is safe: messages are claimed via a conditional DynamoDB write before
      # classification (db.ClaimMessages), so only one concurrent invocation ever pays for
      # the LLM call on a given message — not just "dedupe after the fact". Re-add
      # `ReservedConcurrentExecutions: 1` after requesting a concurrency-limit increase via
      # Service Quotas.
      LoggingConfig:
        LogGroup: !Ref ScanFunctionLogGroup
      Environment:
        Variables:
          MODE: scan

  # ----------------------------------------------------------------
  # Push function — public Function URL that receives Gmail Pub/Sub push
  # notifications. AuthType NONE because Pub/Sub can't sign SigV4; the app
  # instead validates the Google-signed OIDC token on every request.
  # ----------------------------------------------------------------
  PushFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      Runtime: provided.al2023
      Handler: bootstrap
      Role: !GetAtt LambdaRole.Arn
      MemorySize: 128
      # 900s = Lambda's hard max. Classification is global (see ClassifyTier), so a real-time
      # push can also land on the flex tier and queue for minutes; the old 120s cap risked
      # killing it mid-classification. Safe to run long: a re-delivered or overlapping push is
      # made idempotent by the history-id watermark (cheap skip) plus the per-message claim
      # lease in DynamoDB (db.ClaimMessages), which is what actually stops two overlapping
      # invocations from both paying for the LLM call on the same email.
      Timeout: 900
      # Lambda Web Adapter layer — see WebFunction above for why this is needed.
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerArm64:${LambdaWebAdapterLayerVersion}
      LoggingConfig:
        LogGroup: !Ref PushFunctionLogGroup
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
      Environment:
        Variables:
          MODE: push
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"

  # ----------------------------------------------------------------
  # CloudWatch log groups with bounded retention. Without these, Lambda implicitly
  # creates never-expiring log groups on first invocation. RetentionInDays reuses the
  # LogRetentionDays parameter so CloudWatch and DynamoDB-row retention stay in step.
  #
  # Deliberately NOT named /aws/lambda/<function>: those groups were already
  # implicitly created by past invocations, and CloudFormation refuses to create
  # over an existing group. Fresh /ollamail/* names + each function's LoggingConfig
  # pointing here sidestep the conflict with no deletion/import migration. The old
  # /aws/lambda/ollamail-* groups stop receiving logs after this deploy and can be
  # deleted whenever (they hold only pre-migration operational logs).
  # ----------------------------------------------------------------
  WebFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ollamail/web
      RetentionInDays: !Ref LogRetentionDays

  ScanFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ollamail/scan
      RetentionInDays: !Ref LogRetentionDays

  PushFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ollamail/push
      RetentionInDays: !Ref LogRetentionDays

  # ----------------------------------------------------------------
  # EventBridge Scheduler schedule that triggers the scan. Real-time labeling is handled by
  # Gmail push; this scheduled pass is a daily safety net (catch-up scan + watch() renewal).
  # Fixed at 2 AM local time (ScheduleExpressionTimezone makes the cron DST-aware) so the
  # catch-up's flex-tier Bedrock traffic lands off-peak instead of during business hours.
  # This cadence is intentionally not user-configurable — no web UI setting rewrites it.
  # ----------------------------------------------------------------
  ScanSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: ollamail-scan
      FlexibleTimeWindow:
        Mode: "OFF"
      ScheduleExpression: cron(0 2 * * ? *)
      ScheduleExpressionTimezone: America/New_York
      State: ENABLED
      Target:
        Arn: !GetAtt ScanFunction.Arn
        RoleArn: !GetAtt SchedulerInvokeRole.Arn

  # Role EventBridge Scheduler assumes to invoke the ScanFunction.
  SchedulerInvokeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeScanFunction
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:ollamail-scan-fn-arm

  # ----------------------------------------------------------------
  # $5/month hard cap. AWS Budgets only alerts by default, so a Budgets Action
  # attaches an explicit Bedrock-deny policy to the Lambda role at $5 actual spend,
  # halting all LLM (the app's only real cost) until the next month or a manual
  # detach. DynamoDB/Lambda spend at this scale is negligible. Cost data can lag a
  # few hours, so the cap is "within a few hours of $5," not instantaneous.
  # ----------------------------------------------------------------
  BedrockDenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ShouldCreateBudget
    Properties:
      Description: Deny-all Bedrock invocation; parked until the budget action attaches it.
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Deny
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Resource: "*"

  BudgetActionRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateBudget
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttachBedrockDeny
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:GetRole
                  - iam:ListAttachedRolePolicies
                Resource: !GetAtt LambdaRole.Arn

  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: ShouldCreateBudget
    Properties:
      Budget:
        BudgetName: ollamail-monthly-5usd
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: 5
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetAlertEmail

  # At $5 actual spend, attach the Bedrock-deny policy to the Lambda role automatically.
  StopBedrockAtCap:
    Type: AWS::Budgets::BudgetsAction
    Condition: ShouldCreateBudget
    DependsOn: MonthlyBudget
    Properties:
      BudgetName: ollamail-monthly-5usd
      NotificationType: ACTUAL
      ActionType: APPLY_IAM_POLICY
      ApprovalModel: AUTOMATIC
      ActionThreshold:
        Type: ABSOLUTE_VALUE
        Value: 5
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref BedrockDenyPolicy
          Roles:
            - !Ref LambdaRole
      ExecutionRoleArn: !GetAtt BudgetActionRole.Arn
      Subscribers:
        - Type: EMAIL
          Address: !Ref BudgetAlertEmail

Outputs:
  WebFunctionUrl:
    Description: Raw Web UI Function URL (AWS_IAM — browse via a local SigV4 proxy, or via CloudFront/Cloudflare below)
    Value: !GetAtt WebFunctionUrl.FunctionUrl
  WebDistributionDomain:
    Condition: CfAccessEnabled
    Description: Point your Cloudflare proxied CNAME (mailclass) at this CloudFront domain
    Value: !GetAtt WebDistribution.DomainName
  PushFunctionUrl:
    Description: Public push webhook URL — set as the Pub/Sub push endpoint + OIDC audience
    Value: !GetAtt PushFunctionUrl.FunctionUrl
  DynamoDBTableName:
    Value: !Ref OlamailTable
