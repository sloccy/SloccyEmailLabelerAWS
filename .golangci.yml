version: "2"

linters:
  enable:
    # Core correctness
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    # Bug prevention
    - bodyclose
    - nilerr
    - noctx
    - durationcheck
    - fatcontext
    - rowserrcheck
    - sqlclosecheck
    - unparam
    - copyloopvar
    - makezero
    - nosprintfhostport
    - errchkjson
    # Security
    - gosec
    - bidichk
    - forcetypeassert
    - reassign
    # Code quality
    - gocritic
    - errorlint
    - unconvert
    - nakedret
    - intrange
    - modernize
    - exhaustive
    - nilnesserr
    - exptostd
    - errname
    - gocheckcompilerdirectives
    - iface
    - revive
    - usestdlibvars
    - wastedassign
    - whitespace
    - mirror
    # Hygiene
    - misspell
    - dupword
    - asciicheck
    - musttag
    - loggercheck
    - nolintlint
    - canonicalheader
    - recvcheck
    - sloglint
    - predeclared
    # Additional
    - goconst
    - nilnil
    - prealloc
    - perfsprint
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G120 # request body size limited globally via MaxBytesReader middleware
    nolintlint:
      # Every suppression must name the rule it silences and say why, so a reader can tell
      # a considered exemption from a shrug — and so a directive that outlives the finding
      # it was written for is obvious rather than inherited.
      require-specific: true
      require-explanation: true
    staticcheck:
      checks: ["all", "-QF1008", "-ST1000"]
  exclusions:
    rules:
      # Test fixtures repeat literals on purpose: a shared constant for "pending" or a
      # sample prompt would couple unrelated cases and hide what each one is asserting.
      # (This was goconst's own ignore-tests until golangci-lint v2.11 dropped the key.)
      - path: '_test\.go'
        linters:
          - goconst

formatters:
  enable:
    - gofmt
    - goimports
